apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: conexao-solidaria
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: conexao-solidaria
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: Conexão Solidária Dashboards
        folder: Conexão Solidária
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cs
  namespace: conexao-solidaria
data:
  cs-dashboard.json: |
    {
      "title": "Conexão Solidária — Observabilidade",
      "uid": "cs-main",
      "schemaVersion": 38,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "Requisições por segundo (por serviço)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_received_total[1m])) by (app)",
              "legendFormat": "{{app}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Taxa de erros (5xx)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_received_total{code=~\"5..\"}[1m])) by (app)",
              "legendFormat": "{{app}} — erros"
            }
          ]
        },
        {
          "id": 3,
          "title": "Latência P95 por serviço (segundos)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (app, le))",
              "legendFormat": "{{app}} P95"
            }
          ]
        },
        {
          "id": 4,
          "title": "Requisições por status code",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_received_total[1m])) by (code)",
              "legendFormat": "HTTP {{code}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Doações processadas pelo Worker",
          "type": "stat",
          "gridPos": { "x": 0, "y": 16, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "sum(doacoes_processadas_total)",
              "legendFormat": "processadas"
            }
          ]
        },
        {
          "id": 6,
          "title": "Doações ignoradas pelo Worker",
          "type": "stat",
          "gridPos": { "x": 6, "y": 16, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "sum(doacoes_ignoradas_total)",
              "legendFormat": "ignoradas"
            }
          ]
        },
        {
          "id": 7,
          "title": "Requisições em andamento",
          "type": "stat",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 4 },
          "targets": [
            {
              "expr": "sum(http_requests_in_progress) by (app)",
              "legendFormat": "{{app}}"
            }
          ]
        }
      ],
      "time": { "from": "now-15m", "to": "now" }
    }

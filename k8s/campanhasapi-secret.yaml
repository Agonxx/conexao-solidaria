# ATENÇÃO: não commitar este arquivo com valores reais preenchidos.
# Ver instruções em usersapi-secret.yaml.
#
# jwt-secret-key precisa ser IGUAL ao de usersapi-secret e feedbackapi-secret.
# rabbitmq-username/password: "guest"/"guest" no RabbitMQ padrão (sem auth customizada).
apiVersion: v1
kind: Secret
metadata:
  name: campanhasapi-secret
  namespace: conexao-solidaria
type: Opaque
data:
  connection-string: PREENCHER_BASE64
  jwt-secret-key: PREENCHER_BASE64
  rabbitmq-username: PREENCHER_BASE64
  rabbitmq-password: PREENCHER_BASE64

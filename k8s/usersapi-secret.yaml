# ATENÇÃO: não commitar este arquivo com valores reais preenchidos.
# Gere os valores localmente e aplique com `kubectl apply` (ou prefira o
# comando imperativo `kubectl create secret generic` — ver README).
#
# Para gerar os valores base64:
#   [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("VALOR"))
#
# jwt-secret-key precisa ser IGUAL em usersapi-secret, campanhasapi-secret e
# feedbackapi-secret (o mesmo token JWT vale nos três serviços).
apiVersion: v1
kind: Secret
metadata:
  name: usersapi-secret
  namespace: conexao-solidaria
type: Opaque
data:
  connection-string: PREENCHER_BASE64
  jwt-secret-key: PREENCHER_BASE64
